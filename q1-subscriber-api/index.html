<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subscriber Usage Management</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 750px; margin: 30px auto; padding: 0 15px; }
    h2 { color: #333; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
    input, button { padding: 10px; font-size: 14px; }
    button { grid-column: span 2; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; }
  </style>
</head>
<body>
  <h2>Record Subscriber Usage (Q1)</h2>
  <form id="usageForm">
    <input type="text" id="subscriberId" placeholder="Subscriber ID (e.g., SUB01)" required>
    <input type="number" id="callMinutes" placeholder="Call Minutes" required>
    <input type="number" id="smsCount" placeholder="SMS Count" required>
    <input type="number" id="dataUsageMB" placeholder="Data Usage (MB)" required>
    <button type="submit">Submit Record</button>
  </form>

  <h2>Subscriber Usage Records</h2>
  <table>
    <thead>
      <tr>
        <th>Subscriber ID</th>
        <th>Call Minutes</th>
        <th>SMS Count</th>
        <th>Data Usage (MB)</th>
        <th>Timestamp (UTC)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const API_URL = 'http://localhost:3000/api/usage';

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        result.data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.subscriberId}</td>
              <td>${item.callMinutes}</td>
              <td>${item.smsCount}</td>
              <td>${item.dataUsageMB}</td>
              <td>${new Date(item.timestamp).toISOString().replace('T', ' ').substring(0, 19)}</td>
            </tr>
          `;
        });
      } catch (err) {
        console.error('Error fetching records:', err);
      }
    }

    document.getElementById('usageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        subscriberId: document.getElementById('subscriberId').value,
        callMinutes: Number(document.getElementById('callMinutes').value),
        smsCount: Number(document.getElementById('smsCount').value),
        dataUsageMB: Number(document.getElementById('dataUsageMB').value)
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        e.target.reset();
        loadData();
      } else {
        alert('Failed to submit usage record.');
      }
    });

    loadData();
  </script>
</body>
</html>
